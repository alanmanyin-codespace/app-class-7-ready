name: quality-checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Emit npm generated lockfile for bootstrap synchronization
        run: |
          echo "RR7_LOCKFILE_GZIP_B64_START"
          gzip -c package-lock.json | base64 -w0
          echo
          echo "RR7_LOCKFILE_GZIP_B64_END"
      - run: npm run check
      - run: npm run build
