name: quality-checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Emit npm generated lockfile for bootstrap synchronization
        run: |
          node - <<'NODE'
          const lock = require("./package-lock.json");
          console.log("RR7_ANALYTICS_LOCK_ENTRY_START");
          console.log(JSON.stringify(lock.packages["node_modules/@vercel/analytics"]));
          console.log("RR7_ANALYTICS_LOCK_ENTRY_END");
          console.log("RR7_LOCK_ROOT_DEP_START");
          console.log(JSON.stringify(lock.packages[""].dependencies));
          console.log("RR7_LOCK_ROOT_DEP_END");
          NODE
      - run: npm run check
      - run: npm run build
